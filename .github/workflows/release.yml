name: CI/CD - Compilar y Publicar Biblioteca Privada

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*' # Se activa al empujar etiquetas de versión (ej. v1.0.0, v0.1.2)
  workflow_dispatch: # Permite disparar la compilación manualmente desde la interfaz de GitHub

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write # Crítico: Otorga permiso para escribir en GitHub Packages

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      # 2. Instalar y configurar el gestor de paquetes PNPM
      - name: Instalar PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Asegura compatibilidad con tu entorno de compilación

      # 3. Configurar el entorno de ejecución de Node.js apuntando al registro de GitHub Packages
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@agustin' # Fuerza la asociación al namespace de tu organización privada

      # 4. Instalar las dependencias del proyecto de forma limpia
      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      # 5. Correr el validador de código estático (Linter)
      - name: Ejecutar Linter
        run: pnpm run lint
        continue-on-error: false # Detiene el pipeline si hay errores de sintaxis

      # 6. Compilar la biblioteca y generar los archivos de producción (CJS/ESM y .d.ts)
      - name: Compilar UI Library (TSUP)
        run: pnpm run build:ui

      # 7. Publicar el paquete en el registro de GitHub Packages si se detecta una nueva etiqueta de versión
      - name: Publicar en GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Utiliza el token del sistema con permisos temporales de escritura